<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POWER.PRG — Radio v2.5 Reference Match</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050208; color: #e8d0ff; font-family: "Courier New", monospace; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 12px; transition: background 0.4s; }
  h1 { margin: 6px 0 10px; color: #f0a0ff; text-shadow: 0 0 14px #c060ff; letter-spacing: 2px; }
  .crt-frame { position: relative; padding: 26px 18px 32px; background: linear-gradient(160deg, #1a1220 0%, #120c18 60%, #0a0810 100%); border-radius: 32px 32px 20px 20px; box-shadow: 0 0 0 12px #080410, 0 0 60px #401060, inset 0 0 30px rgba(255,255,255,0.04), inset 0 2px 0 rgba(255,255,255,0.08); }
  .crt-screen { position: relative; width: 100%; max-width: 440px; background: #0a0612; border-radius: 14px; overflow: hidden; box-shadow: inset 0 0 80px #000, 0 0 40px rgba(192,96,255,0.2), inset 0 0 0 3px #1a1028; padding: 20px 16px 24px; }
  .crt-screen::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,0.18) 2px 3px); pointer-events: none; z-index: 30; animation: scanFlicker 0.1s infinite; }
  .crt-screen::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%), linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 45%); pointer-events: none; z-index: 31; }
  .radio { position: relative; width: 360px; height: 280px; margin: 8px auto 10px; background: linear-gradient(160deg, #1c1828 0%, #12101c 50%, #0a0814 100%); border: 5px solid #2a2638; border-radius: 8px; box-shadow: 0 14px 0 #060410, inset 0 1px 0 #3a3648, 0 0 30px rgba(64,232,255,0.06); }
  .handle { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); width: 160px; height: 32px; background: linear-gradient(to bottom, #2a2638, #1a1828); border: 4px solid #3a3648; border-radius: 6px 6px 0 0; box-shadow: inset 0 -2px 0 #0a0814; }
  .handle::before { content: ""; position: absolute; top: 8px; left: 20px; right: 20px; height: 8px; background: repeating-linear-gradient(to right, #3a3648 0 4px, #2a2638 4px 8px); border-radius: 2px; }
  .speaker { position: absolute; left: 14px; top: 22px; width: 130px; height: 120px; background: #080610; border: 3px solid #40e8ff; border-radius: 6px; box-shadow: 0 0 16px #20c0e0, inset 0 0 20px rgba(64,232,255,0.1); }
  .speaker-grill { position: absolute; inset: 10px; background: repeating-linear-gradient(to bottom, #1a1828 0 3px, #0a0810 3px 6px); border-radius: 3px; border: 1px solid #203848; box-shadow: inset 0 0 8px rgba(0,0,0,0.6); }
  .freq-dial { position: absolute; right: 22px; top: 16px; width: 78px; height: 78px; background: radial-gradient(circle at 35% 30%, #1a1830, #0a0810 70%); border: 4px solid #40e8ff; border-radius: 50%; box-shadow: 0 0 24px #20c0e0, inset 0 0 16px rgba(64,232,255,0.2); }
  .freq-dial::before { content: "88  92  96  100  104  108"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 6px; color: #60d0e0; letter-spacing: 1px; opacity: 0.7; }
  .needle { width: 3px; height: 30px; background: linear-gradient(to top, #40e8ff, #c0ffee); box-shadow: 0 0 10px #40e8ff; }
  .freq-display { right: 18px; top: 102px; width: 140px; height: 28px; border: 2px solid #40e8ff; font-size: 14px; letter-spacing: 1px; }
  .pwr-cell { right: 14px; bottom: 14px; width: 150px; height: 100px; border: 3px solid #c060ff; border-radius: 4px; box-shadow: 0 0 20px #a040e0, inset 0 0 20px rgba(192,96,255,0.15); }
  .circuit { background: radial-gradient(circle at 50% 40%, #f0a0ff 0%, transparent 40%), linear-gradient(90deg, transparent 40%, #c060ff 41%, transparent 42%), linear-gradient(0deg, transparent 30%, #a040e0 31%, transparent 32%); }
  .m58-label { font-size: 18px; letter-spacing: 2px; text-shadow: 0 0 8px #c060ff; }
  .m58-sub { font-size: 9px; letter-spacing: 1px; }
  .speaker { position: absolute; left: 16px; top: 26px; width: 120px; height: 110px; background: #080610; border: 3px solid #40e8ff; border-radius: 8px; transition: box-shadow 0.3s, opacity 0.3s; box-shadow: 0 0 12px #20c0e0; }
  .speaker.playing { animation: speakerPulse 1.5s ease-in-out infinite; }
  @keyframes speakerPulse { 0%,100%{box-shadow:0 0 18px #20c0e0, inset 0 0 10px rgba(64,232,255,0.15);} 50%{box-shadow:0 0 36px #40f0ff, inset 0 0 16px rgba(64,240,255,0.25);} }
  .speaker-grill { position: absolute; inset: 8px; background: repeating-linear-gradient(to bottom, #1a1828 0 2px, #0a0810 2px 4px), repeating-linear-gradient(to right, transparent 0 8px, rgba(64,232,255,0.04) 8px 9px); border-radius: 4px; border: 1px solid #203040; }
  .now-playing { position: absolute; left: 16px; top: 148px; width: 120px; height: 24px; background: #080610; border: 2px solid #40e8ff; border-radius: 4px; font-size: 10px; color: #a0ffee; display: flex; align-items: center; justify-content: center; overflow: hidden; text-shadow: 0 0 8px #40e8ff; box-shadow: 0 0 14px #20c0e0, inset 0 0 6px rgba(64,232,255,0.2); letter-spacing: 0.5px; }
  .freq-dial { position: absolute; right: 18px; top: 20px; width: 70px; height: 70px; background: radial-gradient(circle at 40% 35%, #1a1830, #0a0810); border: 3px solid #40e8ff; border-radius: 50%; box-shadow: 0 0 22px #20c0e0, inset 0 0 12px rgba(64,232,255,0.15); cursor: ns-resize; }
  .freq-dial::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1px dashed rgba(64,232,255,0.25); }
  .needle { position: absolute; top: 50%; left: 50%; width: 3px; height: 28px; background: linear-gradient(to top, #40e8ff, #a0ffee); transform-origin: bottom center; transform: translate(-50%, -100%) rotate(0deg); box-shadow: 0 0 8px #40e8ff; border-radius: 1px; }
  .freq-display { position: absolute; right: 16px; top: 98px; width: 130px; height: 26px; background: #080610; border: 2px solid #40e8ff; border-radius: 4px; font-size: 13px; color: #80ffee; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 6px #40e8ff; box-shadow: 0 0 10px #20c0e0; }
  .pwr-cell { position: absolute; right: 16px; bottom: 16px; width: 140px; height: 86px; background: #080610; border: 3px solid #c060ff; border-radius: 6px; overflow: hidden; transition: box-shadow 0.3s, opacity 0.3s; box-shadow: 0 0 16px #a040e0; }
  .pwr-cell.playing { animation: cellPulse 1.7s ease-in-out infinite; }
  @keyframes cellPulse { 0%,100%{box-shadow:0 0 18px #a040e0;} 50%{box-shadow:0 0 36px #e080ff;} }
  .circuit { position: absolute; inset: 8px; background: radial-gradient(circle at 50% 40%, #f0a0ff 0%, transparent 50%); }
  .pwr-label { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 7px; color: #80e0ff; }
  .m58-label { position: absolute; left: 18px; bottom: 28px; font-size: 15px; font-weight: bold; color: #d0b0ff; }
  .m58-sub { position: absolute; left: 18px; bottom: 12px; font-size: 8px; color: #9060c0; }
  .station-name { text-align: center; font-size: 14px; color: #80ffee; margin: 4px 0; min-height: 18px; position: relative; z-index: 10; }
  .info { text-align: center; margin-top: 4px; position: relative; z-index: 10; }
  .power-bar { height: 10px; background: #1a1020; border: 2px solid #5a4070; margin: 4px auto; width: 70%; }
  .power-fill { height: 100%; background: linear-gradient(90deg, #40e8ff, #c060ff); width: 40%; transition: width 0.3s; }
  button { background: #2a1048; color: #f0e0ff; border: 2px solid #a060ff; padding: 6px 10px; font-family: inherit; margin: 3px; cursor: pointer; position: relative; z-index: 10; }
  .presets { margin-top: 6px; }
  .preset { font-size: 11px; padding: 4px 8px; }
  .themes { margin-top: 6px; }
  .theme-btn { font-size: 10px; padding: 3px 7px; }
  .inside { display: none; }
  .universe { margin-top: 8px; font-size: 12px; line-height: 1.5; color: #d0b0f0; background: #1a1028; padding: 10px; border: 2px solid #6030a0; border-radius: 6px; }
  .status { font-size: 11px; color: #b090d0; margin-top: 4px; }
  .hint { font-size: 10px; color: #8060a0; margin-top: 4px; }
  audio { display: none; }
  body.theme-amber { background: #1a1008; color: #ffb040; }
  body.theme-amber .crt-frame { box-shadow: 0 0 0 10px #100808, 0 0 40px #603010; }
  body.theme-amber .speaker, body.theme-amber .freq-dial, body.theme-amber .now-playing { border-color: #ffb040; box-shadow: 0 0 16px #ff8020; }
  body.theme-green { background: #061208; color: #40ff60; }
  body.theme-green .crt-frame { box-shadow: 0 0 0 10px #080810, 0 0 40px #106020; }
  body.theme-green .speaker, body.theme-green .freq-dial, body.theme-green .now-playing { border-color: #40ff60; box-shadow: 0 0 16px #20c040; }
</style>
</head>
<body>
<h1>🎮 POWER.PRG</h1>
<div class="crt-frame">
  <div class="crt-screen">
    <div id="outside">
      <div class="radio">
        <div class="handle"></div>
        <div class="speaker" id="speaker"><div class="speaker-grill"></div></div>
        <div class="vu-bars" id="vuBars">
          <div class="vu-bar"></div><div class="vu-bar"></div><div class="vu-bar"></div>
          <div class="vu-bar"></div><div class="vu-bar"></div>
        </div>
        <div class="now-playing" id="nowPlaying">—</div>
        <div class="vol-knob" id="volKnob"></div>
        <div class="freq-dial" id="freqDial">
          <div class="needle" id="needle"></div>
        </div>
        <div class="freq-display" id="freqDisplay">92.0</div>
        <div class="pwr-cell" id="pwrCell"><div class="circuit"></div><div class="pwr-label">PWR-CELL // 03</div></div>
        <div class="m58-label">M58</div>
        <div class="m58-sub">NEON-NIGHT</div>
      </div>
      <div class="station-name" id="stationName">—</div>
      <div class="info">
        <div class="power-bar"><div class="power-fill" id="out-fill"></div></div>
        <p>Battery: <span id="out-power">40</span>%</p>
        <button onclick="togglePower()">POWER</button>
        <button onclick="seek()">SEEK</button>
        <button onclick="openBattery()">OPEN BATTERY</button>
        <div class="presets">
          <button class="preset" onclick="preset(88.5)">GS</button>
          <button class="preset" onclick="preset(92.0)">SSS</button>
          <button class="preset" onclick="preset(94.5)">VAP</button>
          <button class="preset" onclick="preset(106.5)">NR</button>
        </div>
        <div class="themes">
          <button class="theme-btn" onclick="setTheme('neon')">NEON</button>
          <button class="theme-btn" onclick="setTheme('amber')">AMBER</button>
          <button class="theme-btn" onclick="setTheme('green')">GREEN</button>
        </div>
        <div class="hint">v2.5 — closer to M58 Neon-Night reference</div>
      </div>
    </div>
    <div id="inside" class="inside">
      <div class="info">
        <h2>Inside the Battery</h2>
        <p><strong>Signal Keepers</strong></p>
        <div class="power-bar"><div class="power-fill" id="in-fill"></div></div>
        <p>Power: <span id="in-power">40</span>%</p>
        <div class="universe" id="universeText">Crystal towers pulse in the neon dark. Keepers climb the lattices and tune the crystals.</div>
        <button onclick="boost()">BOOST</button>
        <button onclick="rest()">REST</button>
        <button onclick="closeBattery()">CLOSE BATTERY</button>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>
</div>
<audio id="radioAudio"></audio>
<script>
let power = 40;
let freq = 92.0;
let volume = 0.4;
let isOn = false;
let audioCtx = null;
let noiseSource = null;
let noiseGain = null;
let vuInterval = null;

// 20 stations from Westside loader (WEST-007)
const stations = [
  { freq: 88.0, name: "Nightwave Plaza", url: "https://radio.plaza.one/mp3_96" },
  { freq: 88.5, name: "Groove Salad", url: "https://ice5.somafm.com/groovesalad-128-mp3" },
  { freq: 89.3, name: "Deep Space One", url: "https://ice5.somafm.com/deepspaceone-128-mp3" },
  { freq: 90.2, name: "Drone Zone", url: "https://ice5.somafm.com/dronezone-128-mp3" },
  { freq: 90.8, name: "Ambient.FM", url: "https://phoebe.streamerr.co:4140/ambient.mp3" },
  { freq: 91.0, name: "Underground 80s", url: "https://ice5.somafm.com/u80s-128-mp3" },
  { freq: 92.0, name: "Space Station Soma", url: "https://ice5.somafm.com/spacestation-128-mp3" },
  { freq: 93.7, name: "Secret Agent", url: "https://ice5.somafm.com/secretagent-128-mp3" },
  { freq: 94.5, name: "Vaporwaves", url: "https://ice5.somafm.com/vaporwaves-128-mp3" },
  { freq: 95.2, name: "Moss Garden", url: "https://radio.moss.garden/listen/moss_garden/radio.mp3" },
  { freq: 96.0, name: "Doomed", url: "https://ice5.somafm.com/doomed-128-mp3" },
  { freq: 97.1, name: "Lush", url: "https://ice5.somafm.com/lush-128-mp3" },
  { freq: 98.5, name: "Seven Inch Soul", url: "https://ice5.somafm.com/7soul-128-mp3" },
  { freq: 99.8, name: "PopTron", url: "https://ice5.somafm.com/poptron-128-mp3" },
  { freq: 101.2, name: "The In-Sound (Special)", url: "https://ice5.somafm.com/insound-128-mp3" },
  { freq: 102.5, name: "DEF CON Radio", url: "https://ice5.somafm.com/defcon-128-mp3" },
  { freq: 103.8, name: "SceneSat", url: "https://streams.scenesat.com/main/hq.mp3" },
  { freq: 105.0, name: "n5MD Radio", url: "https://ice5.somafm.com/n5md-128-mp3" },
  { freq: 106.5, name: "Nightride FM", url: "https://nightride.fm/stream/nightride.mp3" },
  { freq: 107.3, name: "Limbik Frequencies", url: "https://limbikfreq.com:10443/listen/limbik_frequencies/128.mp3" }
];

const audio = document.getElementById("radioAudio");
const speaker = document.getElementById("speaker");
const pwrCell = document.getElementById("pwrCell");
const needle = document.getElementById("needle");
const nowPlaying = document.getElementById("nowPlaying");
const vuBars = document.querySelectorAll(".vu-bar");
const volKnob = document.getElementById("volKnob");

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function stopStatic() {
  if (noiseSource) { try { noiseSource.stop(); } catch(e){} noiseSource = null; }
  if (noiseGain) { noiseGain.disconnect(); noiseGain = null; }
}

function playStatic() {
  stopStatic();
  const ctx = getCtx();
  const bufferSize = ctx.sampleRate * 2;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  noiseSource = ctx.createBufferSource();
  noiseSource.buffer = buffer;
  noiseSource.loop = true;
  noiseGain = ctx.createGain();
  const staticLevel = power < 30 ? 0.45 : 0.22;
  noiseGain.gain.value = volume * staticLevel * (power / 100);
  noiseSource.connect(noiseGain);
  noiseGain.connect(ctx.destination);
  noiseSource.start();
}

function getClosestStation() {
  let closest = null;
  let minDiff = 999;
  stations.forEach(s => {
    const d = Math.abs(s.freq - freq);
    if (d < minDiff) { minDiff = d; closest = s; }
  });
  return (minDiff <= 0.8) ? closest : null;
}

function snapToStation() {
  let closest = stations[0];
  let minDiff = 999;
  stations.forEach(s => {
    const d = Math.abs(s.freq - freq);
    if (d < minDiff) { minDiff = d; closest = s; }
  });
  if (minDiff < 1.5) freq = closest.freq;
}

function updateNeedle() {
  const angle = ((freq - 88) / 20) * 140 - 70;
  needle.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
}

function animateVU() {
  if (vuInterval) clearInterval(vuInterval);
  if (!isOn) {
    vuBars.forEach(b => b.style.height = "8px");
    return;
  }
  vuInterval = setInterval(() => {
    vuBars.forEach(b => {
      const h = 8 + Math.random() * (isOn ? 32 : 4);
      b.style.height = h + "px";
    });
  }, 120);
}

function setPlayingVisual(on) {
  if (on && isOn) {
    speaker.classList.add("playing");
    pwrCell.classList.add("playing");
  } else {
    speaker.classList.remove("playing");
    pwrCell.classList.remove("playing");
  }
  pwrCell.style.opacity = power < 25 ? 0.55 : 1;
  speaker.style.opacity = power < 20 ? 0.6 : 1;
  animateVU();
}

function playStation() {
  audio.pause();
  audio.src = "";
  stopStatic();
  setPlayingVisual(false);
  if (!isOn || power < 8) {
    document.getElementById("stationName").textContent = isOn ? "LOW POWER" : "OFF";
    nowPlaying.textContent = isOn ? "LOW" : "OFF";
    return;
  }
  const station = getClosestStation();
  if (station) {
    audio.src = station.url;
    audio.volume = volume * (power / 100);
    audio.play().then(() => {
      document.getElementById("stationName").textContent = station.name;
      nowPlaying.textContent = station.name.split(" ")[0].substring(0, 8);
      setPlayingVisual(true);
    }).catch(() => {
      document.getElementById("stationName").textContent = station.name + " — static";
      nowPlaying.textContent = "STATIC";
      playStatic();
      setPlayingVisual(true);
    });
  } else {
    document.getElementById("stationName").textContent = "static...";
    nowPlaying.textContent = "STATIC";
    playStatic();
    setPlayingVisual(true);
  }
}

function updateDisplay() {
  document.getElementById("freqDisplay").textContent = freq.toFixed(1);
  document.getElementById("out-power").textContent = power;
  document.getElementById("in-power").textContent = power;
  document.getElementById("out-fill").style.width = power + "%";
  document.getElementById("in-fill").style.width = power + "%";
  if (audio) audio.volume = volume * (power / 100);
  if (noiseGain) {
    const staticLevel = power < 30 ? 0.45 : 0.22;
    noiseGain.gain.value = volume * staticLevel * (power / 100);
  }
  updateNeedle();
  const volAngle = (volume - 0.2) / 0.5 * 120 - 60;
  volKnob.style.transform = `rotate(${volAngle}deg)`;
  setPlayingVisual(isOn);
}

function togglePower() {
  isOn = !isOn;
  if (isOn) {
    getCtx().resume();
    playStation();
  } else {
    audio.pause();
    stopStatic();
    setPlayingVisual(false);
    document.getElementById("stationName").textContent = "OFF";
    nowPlaying.textContent = "OFF";
  }
}

function seek() {
  const sorted = [...stations].sort((a,b) => a.freq - b.freq);
  let next = sorted.find(s => s.freq > freq + 0.3);
  if (!next) next = sorted[0];
  freq = next.freq;
  updateDisplay();
  if (isOn) playStation();
}

function preset(f) {
  freq = f;
  updateDisplay();
  if (isOn) playStation();
}

function setTheme(t) {
  document.body.className = t === "neon" ? "" : "theme-" + t;
}

let dragging = false;
document.getElementById("freqDial").addEventListener("mousedown", () => dragging = true);
document.getElementById("freqDial").addEventListener("touchstart", () => dragging = true);
window.addEventListener("mouseup", () => { if (dragging) { snapToStation(); if (isOn) playStation(); } dragging = false; });
window.addEventListener("touchend", () => { if (dragging) { snapToStation(); if (isOn) playStation(); } dragging = false; });
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  freq = Math.max(88, Math.min(108, freq - e.movementY * 0.1));
  updateDisplay();
});
window.addEventListener("touchmove", e => {
  if (!dragging) return;
  freq = Math.max(88, Math.min(108, freq + (e.touches[0].clientY % 2 === 0 ? 0.15 : -0.15)));
  updateDisplay();
});

volKnob.addEventListener("click", () => {
  volume = volume >= 0.7 ? 0.2 : volume + 0.15;
  updateDisplay();
});

function openBattery() {
  document.getElementById("outside").style.display = "none";
  document.getElementById("inside").style.display = "block";
  document.getElementById("status").textContent = "Inside the PWR-CELL.";
  document.getElementById("universeText").textContent = power > 60
    ? "Keepers move quickly. Crystals blaze. The signal is strong and clear."
    : power > 30
    ? "Keepers climb the lattices and tune. The glow is steady."
    : "Keepers move slowly. Towers dim. Static creeps into the signal.";
}
function closeBattery() {
  document.getElementById("inside").style.display = "none";
  document.getElementById("outside").style.display = "block";
}
function boost() {
  power = Math.min(100, power + 15);
  updateDisplay();
  document.getElementById("status").textContent = "Keepers surge. Signal clears.";
  document.getElementById("universeText").textContent = "A burst of light. Keepers climb faster. The circuits answer.";
  if (isOn) playStation();
}
function rest() {
  power = Math.max(5, power - 15);
  updateDisplay();
  document.getElementById("status").textContent = "Keepers rest. Glow softens.";
  document.getElementById("universeText").textContent = "The towers quiet. Keepers settle. Static returns to the edges.";
  if (isOn) playStation();
}
updateDisplay();
</script>
</body>
</html>
